<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>giftkit - product playground</title>
  <link rel="stylesheet" href="./playground.css">
</head>
<body>
  <header class="bar">
    <strong>Product playground</strong>
    <label>Product <select id="product"></select></label>
    <label>Screen
      <select id="frame">
        <option value="390x844">Phone 390 x 844</option>
        <option value="360x640">Small phone 360 x 640</option>
        <option value="430x932">Large phone 430 x 932</option>
        <option value="768x1024">Tablet 768 x 1024</option>
      </select>
    </label>
    <button id="restart" type="button">Play again</button>
    <a id="open" target="_blank" rel="noopener">Open full screen</a>
  </header>
  <main>
    <form id="form" autocomplete="off"></form>
    <section class="stage">
      <p id="price" role="status"></p>
      <div id="device"><iframe id="gift" title="Live preview"></iframe></div>
      <p id="events" class="events"></p>
    </section>
  </main>
  <script type="module" src="./playground.js"></script>
</body>
</html>
