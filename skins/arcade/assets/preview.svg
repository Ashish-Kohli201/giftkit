    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4df3ff"/><stop offset="1" stop-color="#2b1766"/></linearGradient>
    <pattern id="floor" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#0e0526"/><rect width="10" height="10" fill="#1a0b3d"/><rect x="10" y="10" width="10" height="10" fill="#1a0b3d"/></pattern>
