    <rect x="12" y="100" width="76" height="14" fill="#14082e"/>
    <circle cx="34" cy="107" r="5" fill="#ff5d7a"/><circle cx="50" cy="107" r="5" fill="#ffd447"/><circle cx="66" cy="107" r="5" fill="#3dffa0"/>
