<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0420">
  <title>A gift</title>
  <link rel="stylesheet" href="./reply.css">
  <style>
    /* The gift fills the whole screen, like a delivered gift would. 100dvh keeps the phone's address bar from hiding buttons. */
    html, body { margin: 0; height: 100%; background: #0b0420; overflow: hidden; }
    #gift-root { position: fixed; inset: 0; height: 100dvh; }
  </style>
</head>
<body>
  <div id="gift-root"></div>
  <script type="module" src="./host.js"></script>
</body>
</html>
